<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Crime Analytics ML{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
    {% block extra_head %}{% endblock %}
</head>
<body>
<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div class="logo-wrap">
            <div class="logo-icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <div class="logo-text">
                <span class="logo-title">CrimeVision</span>
                <span class="logo-sub">Analytics & ML</span>
            </div>
        </div>
        <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 12h18M3 6h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
    </div>

    <nav class="sidebar-nav">
        <div class="nav-section-label">MAIN</div>
        <a href="/" class="nav-item {% if request.endpoint=='dashboard' %}active{% endif %}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/><rect x="14" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/><rect x="3" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/><rect x="14" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/></svg>
            <span>Dashboard</span>
        </a>
        <div class="nav-section-label">ANALYTICS</div>
        <a href="/analysis" class="nav-item {% if request.endpoint=='analysis' %}active{% endif %}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Crime Analysis</span>
        </a>
        <div class="nav-section-label">ML</div>
        <a href="/prediction" class="nav-item {% if request.endpoint=='prediction' %}active{% endif %}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2"/><path d="m21 21-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <span>Prediction</span>
        </a>
        <a href="/model" class="nav-item {% if request.endpoint=='model_page' %}active{% endif %}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>ML Model</span>
        </a>
        <div class="nav-section-label">INFO</div>
        <a href="/about" class="nav-item {% if request.endpoint=='about' %}active{% endif %}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/><path d="M12 16v-4M12 8h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <span>About</span>
        </a>
    </nav>

    <div class="sidebar-footer">
        <div class="accuracy-badge">
            <span class="badge-dot"></span>
            <span>Model Online</span>
        </div>
    </div>
</aside>

<!-- Main content -->
<div class="main-wrapper" id="mainWrapper">
    <!-- Top bar -->
    <header class="topbar">
        <div class="topbar-left">
            <button class="mobile-toggle" id="mobileToggle" aria-label="Open menu">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M3 12h18M3 6h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
            <div class="breadcrumb">
                <span class="breadcrumb-root">CrimeVision</span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span class="breadcrumb-current">{% block breadcrumb %}Dashboard{% endblock %}</span>
            </div>
        </div>
        <div class="topbar-right">
            <div class="topbar-badge">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 2v20M2 12h20" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/></svg>
                <span>Live Analytics</span>
            </div>
            <div class="topbar-date" id="topbarDate"></div>
        </div>
    </header>

    <!-- Page content -->
    <main class="page-content">
        {% block content %}{% endblock %}
    </main>
</div>

<!-- Overlay for mobile -->
<div class="overlay" id="overlay"></div>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
